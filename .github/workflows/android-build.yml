name: Build BrushApp Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Create encrypted signing key if needed
        env:
          BRUSHAPP_KEY_PASSWORD: ${{ secrets.BRUSHAPP_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BRUSHAPP_KEY_PASSWORD:-}" ]; then
            echo "GitHub Secret BRUSHAPP_KEY_PASSWORD belum diatur."
            exit 1
          fi

          mkdir -p signing
          if [ ! -f signing/brushapp-release.jks.enc ]; then
            echo "Membuat kunci tanda tangan BrushApp pertama kali..."
            keytool -genkeypair -v \
              -keystore brushapp-release.jks \
              -alias brushapp \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$BRUSHAPP_KEY_PASSWORD" \
              -keypass "$BRUSHAPP_KEY_PASSWORD" \
              -dname "CN=BrushApp, OU=Personal, O=BrushApp, L=Jakarta, ST=DKI Jakarta, C=ID"

            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
              -in brushapp-release.jks \
              -out signing/brushapp-release.jks.enc \
              -pass env:BRUSHAPP_KEY_PASSWORD
            rm -f brushapp-release.jks

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/brushapp-release.jks.enc
            git commit -m "Add encrypted BrushApp release signing key [skip ci]"
            git push
          else
            echo "Kunci tanda tangan terenkripsi sudah tersedia."
          fi

      - name: Restore signing key
        env:
          BRUSHAPP_KEY_PASSWORD: ${{ secrets.BRUSHAPP_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/brushapp-release.jks.enc \
            -out app/brushapp-release.jks \
            -pass env:BRUSHAPP_KEY_PASSWORD

      - name: Build signed Release APK
        env:
          BRUSHAPP_KEY_PASSWORD: ${{ secrets.BRUSHAPP_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk BrushApp.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: brushapp-build-${{ github.run_number }}
          name: BrushApp Release ${{ github.run_number }}
          files: BrushApp.apk
          generate_release_notes: true
          make_latest: true
